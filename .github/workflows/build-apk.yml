name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"

jobs:
  build:
    name: 🚀 Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install NPM dependencies
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: 🌐 Build web application
        run: |
          npm run build

      - name: 🔄 Sync Capacitor Android
        run: |
          npx cap sync android || true
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/ 2>/dev/null || true

      - name: ☕ Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configure Android SDK & Accept Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Ensure platform 34 and build-tools 34 are installed
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔑 Ensure Gradle Wrapper & Permissions
        run: |
          chmod +x ./gradlew ./android/gradlew 2>/dev/null || true
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p android/gradle/wrapper
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar || true
          fi

      - name: 🔨 Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🔍 Verify and Collect APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*debug*.apk" -type f 2>/dev/null | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp -f "$APK_FILE" "app/build/outputs/apk/debug/app-debug.apk"
            echo "### ✅ Android APK Built Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
            echo "- **Generated APK:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Source:** \`${APK_FILE}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Download:** Check the Artifacts section below." >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::No debug APK found!" >&2
            exit 1
          fi

      - name: 📤 Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
