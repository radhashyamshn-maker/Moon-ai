name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (One-Shot Reliable)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      JAVA_TOOL_OPTIONS: "-Xmx4096m"

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Zulu distribution with Gradle cache)
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Configure Android SDK (Ubuntu-latest runner pre-installed SDK)
      - name: Configure Android SDK & Licenses
        run: |
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # Step 4: If Capacitor / Web project, compile web assets & sync to Android
      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Assets & Sync
        if: hashFiles('package.json') != ''
        run: |
          npm install --legacy-peer-deps || true
          npm run build || true
          npx cap sync android || true

      # Step 5: If Flutter project, setup Flutter and build
      - name: Set up Flutter
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter APK
        if: hashFiles('pubspec.yaml') != ''
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release || (flutter clean && flutter pub get && flutter build apk --release)

      # Step 6: Enable Gradle caching for fast and stable builds
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Step 7: Optional Keystore signing from GitHub Secrets
      - name: Setup Release Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TARGET_DIR="."
          if [ -d "android/app" ]; then TARGET_DIR="android"; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$TARGET_DIR/app/release-keystore.jks"
          echo "android.injected.signing.store.file=release-keystore.jks" >> "$TARGET_DIR/gradle.properties"
          echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD" >> "$TARGET_DIR/gradle.properties"
          echo "android.injected.signing.key.alias=$KEY_ALIAS" >> "$TARGET_DIR/gradle.properties"
          echo "android.injected.signing.key.password=$KEY_PASSWORD" >> "$TARGET_DIR/gradle.properties"

      # Step 8: Build Android APK with Gradle (Supports root or android/ subfolder)
      - name: Build APK with Gradle
        run: |
          WORK_DIR="."
          if [ -d "android" ]; then WORK_DIR="android"; fi
          cd "$WORK_DIR"
          
          # Ensure gradlew has execute permission
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

          # Ensure wrapper jar exists
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar || true
          fi

          # Build Release APK, with auto-fallback to Debug if keystore not present
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 9: Report summary with found APK path
      - name: Print Step Summary
        run: |
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          echo "### ✅ APK Built Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "- **Location:** \`${APK_FILE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Download:** Actions Artifacts (Niche dekhein)" >> $GITHUB_STEP_SUMMARY

      # Step 10: Upload APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk
            build/app/outputs/flutter-apk/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 30
