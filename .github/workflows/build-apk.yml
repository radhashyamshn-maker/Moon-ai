name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: 🚀 Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM dependencies
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: 🌐 Build web application
        run: |
          npm run build

      - name: 🔄 Sync Capacitor Android
        run: |
          npx --yes @capacitor/cli sync android
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/ 2>/dev/null || true
          if [ -f "node_modules/@capacitor/android/capacitor/build.gradle" ]; then
            sed -i 's/classpath .com\.android\.tools\.build:gradle:[^'\''"]*./classpath '\''com.android.tools.build:gradle:9.1.1'\''/g' node_modules/@capacitor/android/capacitor/build.gradle 2>/dev/null || true
          fi
          if [ -f "android/capacitor-cordova-android-plugins/build.gradle" ]; then
            sed -i 's/classpath .com\.android\.tools\.build:gradle:[^'\''"]*./classpath '\''com.android.tools.build:gradle:9.1.1'\''/g' android/capacitor-cordova-android-plugins/build.gradle 2>/dev/null || true
            sed -i 's/compileSdkVersion : 36/compileSdkVersion : 35/g' android/capacitor-cordova-android-plugins/build.gradle 2>/dev/null || true
            sed -i 's/targetSdkVersion : 36/targetSdkVersion : 35/g' android/capacitor-cordova-android-plugins/build.gradle 2>/dev/null || true
          fi
          sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' android/app/build.gradle 2>/dev/null || true
          sed -i '/apply plugin: .org\.jetbrains\.kotlin\.android./d' android/app/build.gradle 2>/dev/null || true
          sed -i 's/android\.builtInKotlin=false/android.builtInKotlin=true/g' android/gradle.properties 2>/dev/null || true

      - name: ☕ Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: 📱 Accept Android SDK Licenses
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 🔑 Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          if [ ! -f ./debug.keystore ]; then
            cp ~/.android/debug.keystore ./debug.keystore 2>/dev/null || true
          fi

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🧹 Stop stale Gradle daemons and clean locks
        run: |
          chmod +x ./gradlew ./android/gradlew 2>/dev/null || true
          ./android/gradlew --stop 2>/dev/null || true
          pkill -f '.*gradle.*' 2>/dev/null || true
          find ~/.gradle/caches -name "*.lock" -delete 2>/dev/null || true
          find . -name "*.lock" -delete 2>/dev/null || true

      - name: 🔨 Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon --no-scan

      - name: 🔍 Verify and Collect APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          APK_FILE=$(find . -type f -name "*debug*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp -f "$APK_FILE" "app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "::error::No debug APK found!" >&2
            exit 1
          fi

      - name: 📤 Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
