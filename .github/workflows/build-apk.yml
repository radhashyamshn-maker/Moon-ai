name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Configure Android SDK (Ubuntu-latest runner already has Android SDK pre-installed)
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # Accept Android licenses non-interactively
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # Step 4: Setup Node.js & Sync Web Assets for Capacitor (if present)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci || npm install
          npm run build:client || npm run build || true
          npx cap sync android || true

      # Step 5: Enable Gradle caching for high-speed builds
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Step 6: Grant execution permission to gradlew (or fallback to system gradle)
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      # Step 7: Optional Release Signing Keystore from GitHub Secrets
      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            echo "android.injected.signing.store.file=release-keystore.jks" >> android/gradle.properties
            echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD" >> android/gradle.properties
            echo "android.injected.signing.key.alias=$KEY_ALIAS" >> android/gradle.properties
            echo "android.injected.signing.key.password=$KEY_PASSWORD" >> android/gradle.properties
          fi

      # Step 8: Build APK with Gradle (Release with fallback to Assemble)
      - name: Build APK with Gradle
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug --stacktrace
          else
            gradle assembleRelease || gradle assembleDebug --stacktrace
          fi

      # Step 9: Locate the built APK and print summary
      - name: Locate APK and Print Summary
        id: locate_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "### 📱 Android APK Build Succeeded! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "**APK File Location:** \`$APK_PATH\`" >> $GITHUB_STEP_SUMMARY
          echo "**Runner OS:** Ubuntu Latest" >> $GITHUB_STEP_SUMMARY
          echo "**Java:** JDK 17 (Temurin)" >> $GITHUB_STEP_SUMMARY

      # Step 10: Upload APK as GitHub Actions Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
